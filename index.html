<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stockholm Beauty | Professional Hair & Beauty Salon</title>
    <meta name="description" content="Discover Stockholm Beauty, offering hair colouring, balayage, haircuts, hairstyling, treatments, extensions and beauty services. Contact us to enquire about your next appointment." />
    <meta property="og:title" content="Stockholm Beauty | Professional Hair & Beauty Salon" />
    <meta property="og:description" content="Discover Stockholm Beauty, offering hair colouring, balayage, haircuts, hairstyling, treatments, extensions and beauty services." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        let _fetch = window.fetch;
        if (_fetch) {
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(v) { _fetch = v; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (err) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        if (e.filename && e.filename.includes('chrome-extension://')) {
          e.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && ((e.reason.stack && e.reason.stack.includes('chrome-extension://')) || (e.reason.message && e.reason.message.includes('fetch')))) {
          e.preventDefault();
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
